<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InvestorView</title>
<!-- iPhone: full-screen app when added to the Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InvestorView">
<meta name="theme-color" content="#151a21" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" sizes="256x256" href="icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<script>
// set the theme before the page paints, so there is no dark flash in light mode
(function () { var t = null; try { t = JSON.parse(localStorage.getItem('cd.theme')); } catch (e) {}
  document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand"><img src="icon.svg" alt="" width="22" height="22"><b>Investor<span>View</span></b></div>
  <div class="search">
    <input id="sym" placeholder="Search symbol or company…" data-i18n-ph autocomplete="off" spellcheck="false">
    <ul id="results" hidden></ul>
  </div>
  <nav id="tfs" class="seg"></nav>
  <select id="type" title="Chart type" data-i18n-title>
    <option value="candles" data-i18n>Candles</option>
    <option value="hollow" data-i18n>Hollow candles</option>
    <option value="heikin" data-i18n>Heikin Ashi</option>
    <option value="bars" data-i18n>Bars</option>
    <option value="hlc" data-i18n>HLC bars</option>
    <option value="hilo" data-i18n>High-low</option>
    <option value="line" data-i18n>Line</option>
    <option value="markers" data-i18n>Line with markers</option>
    <option value="step" data-i18n>Step line</option>
    <option value="area" data-i18n>Area</option>
    <option value="baseline" data-i18n>Baseline</option>
    <option value="columns" data-i18n>Columns</option>
    <option value="renko" data-i18n>Renko</option>
  </select>
  <div class="menu">
    <button id="cmpBtn" title="Add another symbol to the chart as a line, to compare how the two have moved." data-i18n-title data-i18n>Compare</button>
    <div id="cmpBox" hidden></div>
  </div>
  <div class="menu">
    <button id="indBtn" data-i18n>Indicators ▾</button>
    <ul id="indMenu" hidden></ul>
  </div>
  <select id="scale" title="Price scale" data-i18n-title>
    <option value="0" data-i18n>Regular scale</option>
    <option value="1" data-i18n>Log scale</option>
    <option value="2" data-i18n>Percent scale</option>
    <option value="3" data-i18n>Indexed to 100</option>
  </select>
  <select id="layout" title="Chart layout: show 1, 2 or 4 charts at once" data-i18n-title>
    <option value="1" data-i18n>1 chart</option>
    <option value="2h" data-i18n>2 charts, side by side</option>
    <option value="2v" data-i18n>2 charts, stacked</option>
    <option value="4" data-i18n>4 charts</option>
  </select>
  <button id="refresh" title="Refresh prices now. They also update by themselves: the chart every 30 seconds, the watchlist every minute." data-i18n-title>⟳</button>
  <span id="updated"></span>
  <button id="more" title="More options" data-i18n-title hidden>⋯</button>
  <span class="spacer"></span>
  <a id="webNote" class="tag" target="_blank" rel="noopener" hidden></a>
  <select id="lang" title="Language" data-i18n-title>
    <option value="auto" data-i18n>Auto</option>
    <option value="en">English</option>
    <option value="zh-CN">简体中文</option>
    <option value="zh-TW">繁體中文</option>
    <option value="ja">日本語</option>
  </select>
  <button id="theme" title="Switch between light and dark theme" data-i18n-title>☀</button>
  <nav id="views" class="seg">
    <button data-view="chart" class="on" data-i18n>Chart</button>
    <button data-view="screener" data-i18n>Screener</button>
  </nav>
</header>

<main id="chartView">
  <aside id="tools"></aside>
  <div id="multi" data-layout="1">
  <section id="stage">
    <div id="chart"></div>
    <canvas id="draw"></canvas>
    <div id="legend">
      <div class="row1"><b id="lgSym"></b><span id="lgName"></span><a id="lgSrc" class="tag" href="/api/diag" target="_blank" rel="noopener" hidden></a><span id="lgOhlc"></span></div>
      <div id="chips"></div>
    </div>
    <div id="hint" hidden></div>
    <div id="msg" hidden></div>
  </section>
  </div>
  <aside id="watch">
    <nav id="sideTabs" class="seg">
      <button data-side="watch" class="on" data-i18n>Watchlist</button>
      <button data-side="pos" title="Your Interactive Brokers positions (read-only)" data-i18n-title><span>IBKR</span><i id="ibDot" hidden></i></button>
      <button data-side="paper" title="Practice account with virtual money" data-i18n-title data-i18n>Paper</button>
      <button data-side="alerts" title="Be told when a price is reached" data-i18n-title data-i18n>Alerts</button>
    </nav>
    <div id="sideAlerts" hidden></div>
    <div id="sidePos" hidden></div>
    <div id="sidePaper" hidden></div>
    <div id="sideWatch">
    <div class="whead"><span data-i18n>Watchlist</span><span><button id="impWatch" title="Import a watchlist exported from another charting app" data-i18n-title data-i18n>Import</button> <button id="addSec" title="Add a section heading" data-i18n-title data-i18n>+ Section</button> <button id="addWatch" title="Add a symbol to a section of the watchlist" data-i18n-title data-i18n>+ Add</button></span></div>
    <ul id="wlist"></ul>
    </div>
  </aside>
</main>

<main id="screenView" hidden>
  <div class="sbar">
    <label><span data-i18n>Universe</span> <select id="uni"></select></label>
    <input id="uniCustom" placeholder="Symbols, comma separated (e.g. AAPL, SHOP, BTC-USD)" data-i18n-ph hidden>
    <label><span data-i18n>Preset</span> <select id="preset"></select></label>
    <button id="scan" class="primary" data-i18n>Scan</button>
    <button id="fToggle" data-i18n>Filters</button>
    <span id="scanInfo"></span>
  </div>
  <div class="filters" id="filters">
    <label><span data-i18n>Price</span> <input data-f="priceMin" type="number" placeholder="min" data-i18n-ph><input data-f="priceMax" type="number" placeholder="max" data-i18n-ph></label>
    <label><span data-i18n>Change %</span> <input data-f="chgMin" type="number" placeholder="min" data-i18n-ph><input data-f="chgMax" type="number" placeholder="max" data-i18n-ph></label>
    <label>RSI <input data-f="rsiMin" type="number" placeholder="min" data-i18n-ph><input data-f="rsiMax" type="number" placeholder="max" data-i18n-ph></label>
    <label><span data-i18n>Rel. volume ≥</span> <input data-f="relVolMin" type="number" step="0.1" placeholder="1.5"></label>
    <label><span data-i18n>Within</span> <input data-f="nearHigh" type="number" placeholder="%"> <span data-i18n>% of 52w high</span></label>
    <label class="chk"><input data-f="above50" type="checkbox"> <span data-i18n>Above SMA 50</span></label>
    <label class="chk"><input data-f="above200" type="checkbox"> <span data-i18n>Above SMA 200</span></label>
    <button id="resetF" data-i18n>Reset filters</button>
  </div>
  <div class="tablewrap">
    <table id="grid"><thead></thead><tbody></tbody></table>
    <div id="gridEmpty" hidden></div>
  </div>
</main>

<nav id="phoneNav" hidden></nav>

<dialog id="impDlg">
  <h3 data-i18n>Import watchlist</h3>
  <p class="muted" data-i18n>Choose an exported watchlist file (.txt or .csv), or paste symbols below — e.g. NASDAQ:AAPL, NYSE:BRK.B, BINANCE:BTCUSDT</p>
  <input id="impFile" type="file" accept=".txt,.csv,text/plain">
  <textarea id="impText" rows="6" placeholder="Paste symbols here" data-i18n-ph spellcheck="false"></textarea>
  <label class="chk"><input id="impReplace" type="checkbox"> <span data-i18n>Replace my current watchlist instead of adding to it</span></label>
  <div id="impInfo" class="muted"></div>
  <div class="dlgBtns"><button id="impCancel" data-i18n>Cancel</button><button id="impGo" class="primary" data-i18n>Import</button></div>
</dialog>

<script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
<script src="i18n.js"></script>
<script src="web-data.js"></script>
<script src="app.js"></script>
</body>
</html>
